# Opt-in overlay adding the AS2 submitter alongside the web server.
#
# This file changes nothing on its own. It only takes effect when passed
# explicitly:
#
#   docker compose -f docker-compose.prod.yml -f docker-compose.as2.yml up -d
#
# The image is built on the instance from a checkout of
# github.com/donihyun/as2-submitter at $AS2_SUBMITTER_SRC, because that
# repository publishes no image.
#
# Required in .env.prod (see deploy/ec2/README.md, "AS2 submitter"):
#   AS2_SUBMITTER_SRC, AS2_FROM_ID, AS2_CALLBACK_TOKEN,
#   SUBMISSION_RECONCILE_TOKEN, AS2_CERTS_DIR
services:
  as2-submitter:
    build:
      context: ${AS2_SUBMITTER_SRC:-/opt/as2-submitter}
      dockerfile: Dockerfile
    image: local/as2-submitter:prod
    container_name: e2br3-as2-submitter
    restart: unless-stopped
    ports:
      # The public AS2 receiver. FDA accepts only 443 or 4080 for an industry
      # gateway URL, and pushes ACK3 and asynchronous MDNs here.
      - "${AS2_RECEIVER_PORT:-4080}:4080"
    environment:
      # Loopback inside a container is unreachable from a sibling container,
      # so the API must bind the wildcard. The container boundary and
      # AS2_INBOUND_TOKEN are what keep it closed; note the API port is
      # deliberately NOT published to the host.
      AS2_SUBMITTER_BIND: "0.0.0.0"
      AS2_SUBMITTER_PORT: "9090"
      AS2_RECEIVER_BIND: "0.0.0.0"
      AS2_RECEIVER_PORT: "4080"
      AS2_RECEIVER_PATH: "${AS2_RECEIVER_PATH:-/as2/receive}"

      AS2_FROM_ID: "${AS2_FROM_ID}"
      AS2_FDA_ROUTING_MODE: "${AS2_FDA_ROUTING_MODE:-routing_id}"
      AS2_FDA_ENV: "${AS2_FDA_ENV:-test}"
      AS2_FDA_ENDPOINT_URL: "${AS2_FDA_ENDPOINT_URL:-}"
      AS2_FDA_ENCRYPT_CERT_PEM_PATH: "${AS2_FDA_ENCRYPT_CERT_PEM_PATH:-/certs/partner.crt}"

      AS2_ENABLE_CRYPTO: "${AS2_ENABLE_CRYPTO:-1}"
      AS2_ENFORCE_MDN_MIC: "${AS2_ENFORCE_MDN_MIC:-1}"
      AS2_SIGNING_PKCS12_PATH: "${AS2_SIGNING_PKCS12_PATH:-/certs/submitter.p12}"
      AS2_SIGNING_PKCS12_PASSWORD: "${AS2_SIGNING_PKCS12_PASSWORD}"
      AS2_RECEIVER_PARTNER_CERTS: "${AS2_RECEIVER_PARTNER_CERTS:-FDA_AERS=/certs/partner.crt}"
      AS2_ASYNC_MDN_URL: "${AS2_ASYNC_MDN_URL:-}"

      AS2_INBOUND_TOKEN: "${AS2_CALLBACK_TOKEN}"
      AS2_CALLBACK_TOKEN: "${AS2_CALLBACK_TOKEN}"
      AS2_STATE_FILE: "/var/lib/as2-submitter/as2-state.json"
    volumes:
      - ${AS2_CERTS_DIR:-/opt/e2br3/as2-certs}:/certs:ro
      - as2-submitter-state:/var/lib/as2-submitter

  # Merged into the base app service; the base file is not modified.
  app:
    environment:
      AS2_SUBMITTER_URL: "http://as2-submitter:9090"
      AS2_ACK_CALLBACK_URL: "http://app:8080/internal/submissions/callbacks/ack"
      AS2_CALLBACK_TOKEN: "${AS2_CALLBACK_TOKEN}"
      SUBMISSION_RECONCILE_TOKEN: "${SUBMISSION_RECONCILE_TOKEN}"
    depends_on:
      - as2-submitter

volumes:
  as2-submitter-state:
