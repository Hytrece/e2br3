name: CD Dev

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [dev]

concurrency:
  group: cd-dev
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  id-token: write

env:
  AWS_REGION: ap-northeast-2
  AWS_SSM_TARGET: i-084938d1a2d95dd92

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push SHA image
        env:
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          IMAGE_REF="ghcr.io/qvis-safety/e2br3-web-server:${SHA}"
          echo "IMAGE_REF=${IMAGE_REF}" >> "${GITHUB_ENV}"
          docker buildx build --platform linux/amd64 --push --tag "${IMAGE_REF}" .

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy through SSM
        env:
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          commands="$(jq -n \
            --arg sha "${SHA}" \
            --arg image "${IMAGE_REF}" \
            '[
              "set -eu",
              "git config --global --add safe.directory /opt/e2br3",
              "cd /opt/e2br3",
              "git fetch origin " + $sha,
              "git checkout --detach " + $sha,
              "set -a; . /opt/e2br3/.env.dev; set +a",
              "BASELINE_IF_EMPTY=1 PROJECT_DIR=/opt/e2br3 /opt/e2br3/deploy/ec2/migrate-rds.sh",
              "APP_DIR=/opt/e2br3 ENV_FILE=/opt/e2br3/.env.dev COMPOSE_FILE=/opt/e2br3/deploy/ec2/docker-compose.prod.yml IMAGE_REF=" + $image + " RESET_DB=0 RELOAD_TERMINOLOGY=0 HEALTHCHECK_URL=http://127.0.0.1:8216/health /opt/e2br3/deploy/ec2/deploy.sh"
            ]')"
          command_id="$(aws ssm send-command \
            --instance-ids "${AWS_SSM_TARGET}" \
            --document-name AWS-RunShellScript \
            --comment "Deploy dev ${SHA}" \
            --parameters "commands=${commands}" \
            --query Command.CommandId --output text)"
          echo "SSM command: ${command_id}"
          aws ssm wait command-executed \
            --command-id "${command_id}" --instance-id "${AWS_SSM_TARGET}" || true
          result="$(aws ssm get-command-invocation \
            --command-id "${command_id}" --instance-id "${AWS_SSM_TARGET}" \
            --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' \
            --output json)"
          echo "${result}"
          test "$(jq -r .Status <<<"${result}")" = Success
